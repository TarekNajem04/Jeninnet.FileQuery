name: Documentation

# Builds the DocFX API/guides site and deploys it to GitHub Pages with the
# artifact-based Pages workflow.
#
# One-time repository setup (owner): Settings -> Pages -> Build and deployment ->
# Source = "GitHub Actions" (the legacy gh-pages branch is no longer used).

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'scripts/docs/**'
      - '.config/dotnet-tools.json'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'README.md'
      - '.github/workflows/docs-build.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'scripts/docs/**'
      - '.config/dotnet-tools.json'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'README.md'
      - '.github/workflows/docs-build.yml'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  # Temporary until GitHub fully migrates Actions to Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    name: Build Documentation

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check documentation links
        run: pwsh scripts/docs/check-doc-links.ps1

      - name: Check README claims
        run: pwsh scripts/docs/check-readme-claims.ps1

      - name: Build libraries for DocFX metadata
        run: |
          set -euo pipefail
          for project in \
            src/Jeninnet.FileQuery/Jeninnet.FileQuery.csproj \
            src/Jeninnet.FileQuery.CommandLine/Jeninnet.FileQuery.CommandLine.csproj \
            src/Jeninnet.FileQuery.DependencyInjection/Jeninnet.FileQuery.DependencyInjection.csproj \
            src/Jeninnet.FileQuery.FileProviders/Jeninnet.FileQuery.FileProviders.csproj \
            src/Jeninnet.FileQuery.Tooling/Jeninnet.FileQuery.Tooling.csproj; do
            dotnet build "$project" --configuration Release --nologo
          done

      - name: Build documentation site (DocFX)
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      - name: Check generated API coverage
        run: pwsh scripts/docs/check-api-reference.ps1

      - name: Prepare static site for GitHub Pages
        run: |
          set -euo pipefail
          touch docs/_site/.nojekyll
          test -f docs/_site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/_site

  deploy:

    name: Deploy GitHub Pages

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
