name: Benchmarks

on:
  workflow_dispatch:

  schedule:
    - cron: '0 3 * * 1'

  push:
    tags:
      - 'v*'

  release:
    types:
      - published

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:

  benchmarks:

    name: Benchmarks (${{ matrix.os }})

    runs-on: ${{ matrix.os }}

    timeout-minutes: 60

    strategy:
      fail-fast: false

      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Jeninnet.FileQuery.slnx

      - name: Check runtime drift
        shell: pwsh
        run: pwsh scripts/performance/check-runtime.ps1

      - name: Record runtime information
        shell: bash
        run: |
          mkdir -p BenchmarkDotNet.Artifacts/results
          dotnet --info | tee BenchmarkDotNet.Artifacts/results/runtime-info.txt

      - name: Run Benchmarks
        run: >
          dotnet run
          --project src/Jeninnet.FileQuery.Benchmarks/Jeninnet.FileQuery.Benchmarks.csproj
          --configuration Release
          --no-restore
          -- --job Short --exporters json markdown

      - name: Upload Results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmarks-${{ matrix.os }}
          path: BenchmarkDotNet.Artifacts/results/
          retention-days: 30
          if-no-files-found: warn
