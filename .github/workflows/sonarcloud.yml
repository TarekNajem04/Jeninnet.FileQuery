name: SonarCloud

# ---------------------------------------------------------
# Enable Workflow on push or pull request
# ---------------------------------------------------------
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "**.csproj"
      - "Directory.Packages.props"
      - "Directory.Build.props"
      - ".github/workflows/sonarcloud.yml"

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "src/**"
      - "test/**"
      - "**.csproj"
      - "Directory.Packages.props"
      - "Directory.Build.props"
      - ".github/workflows/sonarcloud.yml"

permissions:
  contents: read
  pull-requests: write

# ---------------------------------------------------------
# General settings for .NET
# ---------------------------------------------------------
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-analyze:
    name: Build, Test, Analyze
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1) Checkout — Fixing the shallow clone issue
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0        # Fetch the entire Git history
          submodules: recursive # Ensures no internal shallow clone occurs
      # ---------------------------------------------------------
      # 2) Confirm that the Git history is indeed complete
      # ---------------------------------------------------------
      - name: Ensure full git history
        run: |
          git fetch --unshallow || true
          git fetch --all --tags

      # ---------------------------------------------------------
      # 3) Setup Java (required for SonarScanner)
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: "17"

      # ---------------------------------------------------------
      # 4) Setup .NET
      # ---------------------------------------------------------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: "10.0.x"

      # ---------------------------------------------------------
      # 5) Cache NuGet
      # ---------------------------------------------------------
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      # ---------------------------------------------------------
      # 6) Cache SonarCloud
      # ---------------------------------------------------------
      - name: Cache SonarCloud
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # ---------------------------------------------------------
      # 7) Install SonarScanner
      # ---------------------------------------------------------
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      # ---------------------------------------------------------
      # 8) Sonar BEGIN — Start Analysis
      # ---------------------------------------------------------
      - name: Begin SonarCloud analysis
        run: |
          dotnet sonarscanner begin \
            /k:"jeninnet-file-query" \
            /o:"jeninnet-file-query" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.projectBaseDir="." \
            /d:sonar.scm.provider=git \
            /d:sonar.scm.forceReloadAll=true

      # ---------------------------------------------------------
      # 9) Restore
      # ---------------------------------------------------------
      - name: Restore dependencies
        run: dotnet restore

      # ---------------------------------------------------------
      # 10) Build
      # ---------------------------------------------------------
      - name: Build solution
        run: dotnet build -c Release --no-restore

      # ---------------------------------------------------------
      # 11) Test + Coverage
      # ---------------------------------------------------------
      - name: Run tests with coverage
        run: |
          dotnet test -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults

      # ---------------------------------------------------------
      # 12) Sonar END — Analysis Complete
      # ---------------------------------------------------------
      - name: End SonarCloud analysis
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
