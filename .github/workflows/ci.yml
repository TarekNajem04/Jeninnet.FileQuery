name: CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'docs/**'
      - 'scripts/**'
      - 'extensions/**'
      - '**.csproj'
      - '**.slnx'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'README.md'
      - '.editorconfig'
      - '.github/workflows/ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'docs/**'
      - 'scripts/**'
      - 'extensions/**'
      - '**.csproj'
      - '**.slnx'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'README.md'
      - '.editorconfig'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  format:

    name: Format

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Jeninnet.FileQuery.slnx

      - name: Verify formatting
        run: dotnet format Jeninnet.FileQuery.slnx --verify-no-changes --no-restore

  build-and-test:

    name: Build & Test (${{ matrix.os }})

    runs-on: ${{ matrix.os }}

    timeout-minutes: 60

    strategy:
      fail-fast: false

      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Jeninnet.FileQuery.slnx

      - name: Build
        run: dotnet build Jeninnet.FileQuery.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Jeninnet.FileQuery.slnx
          --configuration Release
          --no-build
          --blame-hang-timeout 3m
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults/${{ matrix.os }}

      - name: Collect coverage (canonical ubuntu leg)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          rm -rf artifacts/coverage
          for project in \
            tests/Jeninnet.FileQuery.Tests/Jeninnet.FileQuery.Tests.csproj \
            tests/Jeninnet.AdvancedUsage.Tests/Jeninnet.AdvancedUsage.Tests.csproj \
            tests/Jeninnet.FileQuery.Tool.Tests/Jeninnet.FileQuery.Tool.Tests.csproj \
            tests/Jeninnet.FileQuery.Tooling.Tests/Jeninnet.FileQuery.Tooling.Tests.csproj \
            tests/Jeninnet.Testing.Assertions.Tests/Jeninnet.Testing.Assertions.Tests.csproj; do
            dotnet test "$project" \
              -c Release \
              --no-build \
              --collect:"XPlat Code Coverage" \
              --settings tests/coverage.runsettings \
              --results-directory artifacts/coverage
          done

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/${{ matrix.os }}

  architecture:

    name: Architecture Tests

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:
      - build-and-test

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Jeninnet.FileQuery.slnx

      - name: Build
        run: dotnet build Jeninnet.FileQuery.slnx --configuration Release --no-restore

      - name: Run Architecture Tests
        run: >
          dotnet test Jeninnet.FileQuery.slnx
          --configuration Release
          --filter "FullyQualifiedName~Architecture"

  vscode-extension:

    name: VS Code Extension Tests

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run extension tests
        run: node --test "extensions/vscode/test/*.test.js"

  package-validation:

    name: Package Validation

    runs-on: ubuntu-latest

    timeout-minutes: 45

    needs:
      - build-and-test

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Jeninnet.FileQuery.slnx

      - name: Build
        run: dotnet build Jeninnet.FileQuery.slnx --configuration Release --no-restore

      - name: Pack with Validation
        run: |
          dotnet pack src/Jeninnet.FileQuery/Jeninnet.FileQuery.csproj \
            -c Release \
            /p:EnablePackageValidation=true

          dotnet pack src/Jeninnet.FileQuery.CommandLine/Jeninnet.FileQuery.CommandLine.csproj \
            -c Release \
            /p:EnablePackageValidation=true

          dotnet pack src/Jeninnet.FileQuery.DependencyInjection/Jeninnet.FileQuery.DependencyInjection.csproj \
            -c Release \
            /p:EnablePackageValidation=true

          dotnet pack src/Jeninnet.FileQuery.Tool/Jeninnet.FileQuery.Tool.csproj \
            -c Release \
            /p:EnablePackageValidation=true

          dotnet pack src/Jeninnet.FileQuery.Tooling/Jeninnet.FileQuery.Tooling.csproj \
            -c Release \
            /p:EnablePackageValidation=true
