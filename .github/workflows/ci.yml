name: CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - '**.csproj'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.github/workflows/ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - '**.csproj'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  format:

    name: Format

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

  build-and-test:

    name: Build & Test (${{ matrix.os }})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test
          --configuration Release
          --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults/${{ matrix.os }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/${{ matrix.os }}

  architecture:

    name: Architecture Tests

    runs-on: ubuntu-latest

    needs:
      - build-and-test

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Architecture Tests
        run: >
          dotnet test
          --configuration Release
          --filter "FullyQualifiedName~Architecture"

  package-validation:

    name: Package Validation

    runs-on: ubuntu-latest

    needs:
      - build-and-test

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack with Validation
        run: |
          dotnet pack src/Jeninnet.FileQuery/Jeninnet.FileQuery.csproj \
            -c Release \
            /p:EnablePackageValidation=true

          dotnet pack src/Jeninnet.FileQuery.CommandLine/Jeninnet.FileQuery.CommandLine.csproj \
            -c Release \
            /p:EnablePackageValidation=true

          dotnet pack src/Jeninnet.FileQuery.DependencyInjection/Jeninnet.FileQuery.DependencyInjection.csproj \
            -c Release \
            /p:EnablePackageValidation=true

  benchmarks:

    name: Benchmarks (${{ matrix.os }})

    runs-on: ${{ matrix.os }}

    needs:
      - build-and-test

    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Run Benchmarks
        run: >
          dotnet run
          --project src/Jeninnet.FileQuery.Benchmarks/Jeninnet.FileQuery.Benchmarks.csproj
          --configuration Release
          -- --job Short --exporters json markdown

      - name: Upload Results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmarks-${{ matrix.os }}
          path: BenchmarkDotNet.Artifacts/results/
