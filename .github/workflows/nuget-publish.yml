name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PACKAGES_DIR: artifacts/packages
  PROJECTS: >-
    src/Jeninnet.FileQuery/Jeninnet.FileQuery.csproj
    src/Jeninnet.FileQuery.CommandLine/Jeninnet.FileQuery.CommandLine.csproj
    src/Jeninnet.FileQuery.DependencyInjection/Jeninnet.FileQuery.DependencyInjection.csproj

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      # ---------------------------------------------------------
      # 1) Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2) Setup .NET
      # ---------------------------------------------------------
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"

      # ---------------------------------------------------------
      # 3) Resolve Version from Tag
      # ---------------------------------------------------------
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      # ---------------------------------------------------------
      # 4) Verify Package Versions match Tag
      # ---------------------------------------------------------
      - name: Verify project versions
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"
          $projectList = "${{ env.PROJECTS }}".Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)

          foreach ($project in $projectList) {
            [xml]$xml = Get-Content $project
            $actual = $xml.Project.PropertyGroup.Version | Select-Object -First 1
            if ($actual -ne $expected) {
              throw "Validation failed: $project version '$actual' does not match tag version '$expected'."
            }
          }

      # ---------------------------------------------------------
      # 5) Build and Test
      # ---------------------------------------------------------
      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      # ---------------------------------------------------------
      # 6) Pack Projects
      # ---------------------------------------------------------
      - name: Create output directory
        run: mkdir -p ${{ env.PACKAGES_DIR }}

      - name: Pack projects
        run: |
          for project in ${{ env.PROJECTS }}; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --no-restore \
              /p:EnablePackageValidation=true \
              --output ${{ env.PACKAGES_DIR }}
          done

      # ---------------------------------------------------------
      # 7) Upload and Publish
      # ---------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: ${{ env.PACKAGES_DIR }}
          retention-days: 30

      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push "${{ env.PACKAGES_DIR }}/*.nupkg" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # ---------------------------------------------------------
      # 8) Create GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            ${{ env.PACKAGES_DIR }}/*.nupkg \
            ${{ env.PACKAGES_DIR }}/*.snupkg \
            --title "Release v${{ steps.version.outputs.version }}" \
            --generate-notes
