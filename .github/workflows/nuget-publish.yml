name: Publish NuGet Packages

# Publishes the package set with NuGet.org trusted publishing (OIDC).
#
# One-time setup (owner):
#   1. nuget.org -> account -> Trusted Publishing: add a policy for
#      repository `TarekNajem04/Jeninnet.FileQuery`, workflow `nuget-publish.yml`
#      and environment `production`.
#   2. GitHub repository variables: `NUGET_USER` = the nuget.org profile name.
#   3. GitHub environments: create `production` with required owner reviewers,
#      prevent self-review, and restrict deployment to `main` / `v*` tags.
#
# No static `NUGET_API_KEY` secret is used: `NuGet/login` exchanges the workflow's
# GitHub OIDC token for a short-lived API key tied to the trusted-publishing policy.
# Signing is not part of this pipeline; that remains a separate decision.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PACKAGES_DIR: artifacts/packages
  # Jeninnet.Assertions is an external package and is not published by this
  # release-tag workflow.
  PROJECTS: >-
    src/Jeninnet.FileQuery/Jeninnet.FileQuery.csproj
    src/Jeninnet.FileQuery.CommandLine/Jeninnet.FileQuery.CommandLine.csproj
    src/Jeninnet.FileQuery.DependencyInjection/Jeninnet.FileQuery.DependencyInjection.csproj
    src/Jeninnet.FileQuery.FileProviders/Jeninnet.FileQuery.FileProviders.csproj
    src/Jeninnet.FileQuery.Tool/Jeninnet.FileQuery.Tool.csproj
    src/Jeninnet.FileQuery.Tooling/Jeninnet.FileQuery.Tooling.csproj
    src/Jeninnet.FileQuery.Build/Jeninnet.FileQuery.Build.csproj
    src/Jeninnet.FileQuery.Analyzers/Jeninnet.FileQuery.Analyzers.csproj

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production

    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      # ---------------------------------------------------------
      # 1) Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          conclusion=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml --limit 1 --json conclusion --jq '.[0].conclusion')
          echo "CI conclusion for $GITHUB_SHA: $conclusion"
          test "$conclusion" = "success"

      # ---------------------------------------------------------
      # 2) Setup .NET
      # ---------------------------------------------------------
      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      # ---------------------------------------------------------
      # 3) Resolve Version from Tag
      # ---------------------------------------------------------
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      # ---------------------------------------------------------
      # 4) Verify Package Versions match Tag
      # ---------------------------------------------------------
      - name: Verify project versions
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"
          $projectList = "${{ env.PROJECTS }}".Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)

          # NuGet treats 1.0.0 and 1.0.0.0 as the same version, so compare four-part numeric forms.
          function Get-FourPartVersion([string]$version) {
            $parts = @($version.Split('.'))
            while ($parts.Count -lt 4) { $parts += '0' }
            if ($parts.Count -ne 4 -or @($parts | Where-Object { $_ -notmatch '^\d+$' }).Count -ne 0) {
              return $null
            }
            return ($parts -join '.')
          }

          foreach ($project in $projectList) {
            # Resolve the effective Version property (projects may inherit it from Directory.Build.props).
            $actual = (dotnet msbuild $project -getProperty:Version -nologo -verbosity:quiet).Trim()
            if ($actual -eq $expected) {
              continue
            }

            $expectedNormalized = Get-FourPartVersion $expected
            $actualNormalized = Get-FourPartVersion $actual
            if ($null -ne $expectedNormalized -and $null -ne $actualNormalized -and $actualNormalized -eq $expectedNormalized) {
              continue
            }

            throw "Validation failed: $project version '$actual' does not match tag version '$expected'."
          }

      # ---------------------------------------------------------
      # 5) Build and Test
      # ---------------------------------------------------------
      - name: Restore dependencies
        run: dotnet restore Jeninnet.FileQuery.slnx

      - name: Build solution
        run: dotnet build Jeninnet.FileQuery.slnx --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format Jeninnet.FileQuery.slnx --verify-no-changes --no-restore

      - name: Run tests
        run: dotnet test Jeninnet.FileQuery.slnx --configuration Release --no-build --no-restore --blame-hang-timeout 5m --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Restore documentation tools
        run: dotnet tool restore

      - name: Build documentation and verify docs
        run: |
          dotnet docfx docs/docfx.json --warningsAsErrors
          pwsh scripts/docs/check-doc-links.ps1
          pwsh scripts/docs/check-readme-claims.ps1
          pwsh scripts/docs/check-api-reference.ps1

      # ---------------------------------------------------------
      # 6) Pack Projects
      # ---------------------------------------------------------
      - name: Create output directory
        run: mkdir -p ${{ env.PACKAGES_DIR }}

      - name: Pack projects
        run: |
          for project in ${{ env.PROJECTS }}; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --no-restore \
              /p:EnablePackageValidation=true \
              --output ${{ env.PACKAGES_DIR }}
          done

      - name: Verify package set
        run: |
          set -euo pipefail
          test "$(find "${{ env.PACKAGES_DIR }}" -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 8
          for package in "${{ env.PACKAGES_DIR }}"/*.nupkg; do
            unzip -l "$package" | grep -q 'README.md'
            unzip -l "$package" | grep -q 'LICENSE'
            unzip -l "$package" | grep -q 'icon.png'
          done

      # ---------------------------------------------------------
      # 7) Upload and Publish
      # ---------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: ${{ env.PACKAGES_DIR }}
          retention-days: 30

      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # Symbols ride along with this push: NuGet pairs each sibling .snupkg and only
      # uploads it when the package upload itself succeeds. A separate
      # `dotnet nuget push *.snupkg` step must NOT exist: on a re-run for an
      # already-published version it would overwrite the published symbols with PDBs
      # from a different build (different commit), and nuget.org rejects that with
      # "The uploaded symbols package contains pdb(s) for a corresponding dll(s)
      # not found in the nuget package." (NuGet/Home#10475).
      - name: Push packages to NuGet
        run: |
          dotnet nuget push "${{ env.PACKAGES_DIR }}/*.nupkg" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Verify packages are available on nuget.org
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          for package in "${{ env.PACKAGES_DIR }}"/*.nupkg; do
            name=$(basename "$package" .nupkg)
            id="${name%.$version}"
            id="${id,,}"
            url="https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg"
            code=""
            for attempt in $(seq 1 18); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              if [ "$code" = "200" ]; then
                break
              fi
              sleep 10
            done
            echo "$id $version -> $code"
            test "$code" = "200"
          done

      # ---------------------------------------------------------
      # 8) Create GitHub Release
      # ---------------------------------------------------------
      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              ${{ env.PACKAGES_DIR }}/*.nupkg \
              ${{ env.PACKAGES_DIR }}/*.snupkg \
              --clobber
          else
            gh release create "$tag" \
              ${{ env.PACKAGES_DIR }}/*.nupkg \
              ${{ env.PACKAGES_DIR }}/*.snupkg \
              --title "Release $tag" \
              --generate-notes \
              --verify-tag
          fi
